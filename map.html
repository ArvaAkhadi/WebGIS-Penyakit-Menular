  </div>

<script src="data/Jauh_2.js"></script>

<script>
/* =========================================================
   1. PETA & KONTROL
   ========================================================= */
var map = L.map('map', {
  zoomControl: false, maxZoom: 28, minZoom: 1
}).setView([-6.9932, 110.4203], 11);

new L.Hash(map);
map.attributionControl.setPrefix(
  '<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> ' +
  '&middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>'
);
var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

L.control.zoom({position: 'topleft'}).addTo(map);

/* =========================================================
   2. PANES
   ========================================================= */
map.createPane('pane_GoogleSatellite_0');
map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;

map.createPane('pane_puskesmas');
map.getPane('pane_puskesmas').style.zIndex = 405;

map.createPane('pane_SangatTerjangkau');
map.getPane('pane_SangatTerjangkau').style.zIndex = 410;
map.createPane('pane_Terjangkau');
map.getPane('pane_Terjangkau').style.zIndex = 411;
map.createPane('pane_Jauh');
map.getPane('pane_Jauh').style.zIndex = 412;
map.createPane('pane_TidakTerjangkau');
map.getPane('pane_TidakTerjangkau').style.zIndex = 413;
map.createPane('pane_RumahSakit');
map.getPane('pane_RumahSakit').style.zIndex = 415;

map.createPane('pane_kec_outline');
map.getPane('pane_kec_outline').style.zIndex = 420;
map.getPane('pane_kec_outline').style.pointerEvents = 'none';

/* =========================================================
   3. BASEMAP
   ========================================================= */
L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  pane: 'pane_GoogleSatellite_0',
  opacity: 1.0, attribution: '',
  minZoom: 1, maxZoom: 28,
  minNativeZoom: 0, maxNativeZoom: 19
}).addTo(map);

/* =========================================================
   4. DISSOLVE HELPER
   ========================================================= */
function dissolveGeoJSON(geojsonData) {
  if (!geojsonData || !geojsonData.features || geojsonData.features.length === 0) return null;
  var features = geojsonData.features;
  var merged = features[0];
  for (var i = 1; i < features.length; i++) {
    try {
      var r = turf.union(merged, features[i]);
      if (r) merged = r;
    } catch (e) { console.warn('Union gagal idx ' + i, e); }
  }
  return merged;
}

/* =========================================================
   5. STYLE BUFFER
   ========================================================= */
var STYLE = {
  sangat:     { color: '#00c853', weight: 2.5, fillColor: '#00c853', fillOpacity: 0.10, dashArray: '' },
  terjangkau: { color: '#ffd600', weight: 2.5, fillColor: '#ffd600', fillOpacity: 0.10, dashArray: '' },
  jauh:       { color: '#ff6d00', weight: 2.5, fillColor: '#ff6d00', fillOpacity: 0.10, dashArray: '' },
  tidak:      { color: '#d50000', weight: 2.5, fillColor: '#d50000', fillOpacity: 0.10, dashArray: '4,4' }
};
function paneName(key) {
  return {
    sangat: 'pane_SangatTerjangkau',
    terjangkau: 'pane_Terjangkau',
    jauh: 'pane_Jauh',
    tidak: 'pane_TidakTerjangkau'
  }[key];
}
function styleBufferFixed(key) {
  return function() {
    var s = STYLE[key];
    return {
      pane: paneName(key),
      color: s.color, weight: s.weight, opacity: 1,
      fillColor: s.fillColor, fillOpacity: s.fillOpacity,
      dashArray: s.dashArray,
      lineCap: 'round', lineJoin: 'round'
    };
  };
}
function makeDissolvedBufferPopup(label, color) {
  return function(feature, layer) {
    var html = '<h4 style="color:' + color + ';">Zona Buffer</h4>' +
               '<div class="popup-sub">' + label + '</div>' +
               '<div style="font-size:11px;color:#7f8c8d;">' +
               'Area tergabung dari seluruh puskesmas dalam radius ini.</div>';
    layer.bindPopup(html, {maxHeight: 300, autoPan: true,
      autoPanPaddingTopLeft: L.point(60, 60),
      autoPanPaddingBottomRight: L.point(360, 320),
      keepInView: true});
  };
}

/* =========================================================
   6. BUAT BUFFER LAYER - DISSOLVED
   ========================================================= */
showLoading(true);

setTimeout(function() {
  var dissolvedSangat = dissolveGeoJSON(json_SangatTerjangkau_4);
  var layer_SangatTerjangkau = L.geoJson(dissolvedSangat, {
    pane: 'pane_SangatTerjangkau', style: styleBufferFixed('sangat'),
    onEachFeature: makeDissolvedBufferPopup('Sangat Terjangkau (<1 km)', '#00c853')
  });

  var dissolvedTerjangkau = dissolveGeoJSON(json_Terjangkau_3);
  var layer_Terjangkau = L.geoJson(dissolvedTerjangkau, {
    pane: 'pane_Terjangkau', style: styleBufferFixed('terjangkau'),
    onEachFeature: makeDissolvedBufferPopup('Terjangkau (1-3 km)', '#ffd600')
  });

  var dissolvedJauh = dissolveGeoJSON(json_Jauh_2);
  var layer_Jauh = L.geoJson(dissolvedJauh, {
    pane: 'pane_Jauh', style: styleBufferFixed('jauh'),
    onEachFeature: makeDissolvedBufferPopup('Jauh (3-5 km)', '#ff6d00')
  });

  var dissolvedTidak = dissolveGeoJSON(json_TidakTerjangkau_1);
  var layer_TidakTerjangkau = L.geoJson(dissolvedTidak, {
    pane: 'pane_TidakTerjangkau', style: styleBufferFixed('tidak'),
    onEachFeature: makeDissolvedBufferPopup('Tidak Terjangkau (>5 km)', '#d50000')
  });
  window.AI_ACCESS_LAYERS = {
    sangat: layer_SangatTerjangkau,
    terjangkau: layer_Terjangkau,
    jauh: layer_Jauh,
    tidak: layer_TidakTerjangkau
  };

  /* =========================================================
     7. RS MARKER - PLUS MERAH
     ========================================================= */
  var rsSvg = '<svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg"><path d="M10 2 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 v-6 h8 z" fill="#e74c3c" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/></svg>';

  var rsIcon = L.divIcon({
    className: 'rs-marker',
    html: rsSvg,
    iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -13]
  });

  var layer_RumahSakit = L.geoJson(json_RumahSakit_5, {
    pane: 'pane_RumahSakit',
    pointToLayer: function(feature, latlng) {
      return L.marker(latlng, {pane: 'pane_RumahSakit', icon: rsIcon, riseOnHover: true});
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties || {};
      var nama = p.name || p.official_n || 'Rumah Sakit';
      var html = '<h4>' + nama + '</h4>' +
                 '<div class="popup-sub" style="color:#e74c3c;">Rumah Sakit</div>';
      if (p.addr_full) html += 'Alamat: ' + p.addr_full + '<br>';
      if (p.contact_ph) html += 'Telp: ' + p.contact_ph + '<br>';
      if (p.website)   html += 'Web: ' + p.website;
      layer.bindPopup(html, {maxHeight: 300, autoPan: true,
        autoPanPaddingBottomRight: L.point(360, 320)});
      layer.bindTooltip(nama, {sticky: true});
    }
  });

  /* =========================================================
     8. BIND CHECKBOX -> LAYER
     ========================================================= */
  var layerMap = {
    'rs': layer_RumahSakit,
    'sangat': layer_SangatTerjangkau,
    'terjangkau': layer_Terjangkau,
    'jauh': layer_Jauh,
    'tidak': layer_TidakTerjangkau
  };
  document.querySelectorAll('input[data-layer]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var layer = layerMap[this.dataset.layer];
      if (!layer) return;
      if (this.checked) layer.addTo(map);
      else map.removeLayer(layer);
    });
  });

  /* =========================================================
     9. STATE
     ========================================================= */
  window.state = {
    penyakit: 'dbd', tahun: '2025',
    mapData: {}, barData: {}, areaKm2: {}, mapMode: 'jumlah',
    geojsonLayer: null, outlineLayer: null, chartInstance: null
  };
  window.LABEL_PENYAKIT = {
    'leptospirosis': 'Leptospirosis',
    'tb_baru': 'TB Baru', 'dbd': 'DBD'
  };
  window.KD_TO_KEC = {};
  window.PKM_TO_KEC = {};

  /* =========================================================
     10. LOAD PUSKESMAS -> DISSOLVE KE KECAMATAN
     ========================================================= */
  fetch('data/puskesmas.geojson')
    .then(r => r.json())
    .then(function(gj) {
      gj.features.forEach(function(f) {
        var kd  = f.properties.KD_PUSK;
        var pkm = f.properties.PUSKESMAS;
        var kec = f.properties.KEC;
        if (kd)  window.KD_TO_KEC[kd] = kec;
        if (pkm) window.PKM_TO_KEC[pkm] = kec;
      });

      var groups = {};
      gj.features.forEach(function(f) {
        var kec = f.properties.KEC;
        if (!kec) return;
        if (!groups[kec]) groups[kec] = [];
        groups[kec].push(f);
      });

      var kecFeatures = [];
      Object.keys(groups).forEach(function(kec) {
        var feats = groups[kec];
        var merged = feats[0];
        for (var i = 1; i < feats.length; i++) {
          try {
            var r = turf.union(merged, feats[i]);
            if (r) merged = r;
          } catch (e) { console.warn('Union ' + kec + ' idx ' + i, e); }
        }
        merged.properties = {
          KECAMATAN: kec,
          PUSKESMAS_LIST: feats.map(f => f.properties.PUSKESMAS),
          KD_PUSK_LIST: feats.map(f => f.properties.KD_PUSK),
          N_PUSKESMAS: feats.length
        };
        kecFeatures.push(merged);
      });

      var kecGeoJSON = {type: 'FeatureCollection', features: kecFeatures};

      state.geojsonLayer = L.geoJSON(kecGeoJSON, {
        pane: 'pane_puskesmas',
        style: styleFeature,
        onEachFeature: onEachFeature
      }).addTo(map);

      state.outlineLayer = L.geoJSON(kecGeoJSON, {
        pane: 'pane_kec_outline',
        style: {
          pane: 'pane_kec_outline',
          color: '#000000', weight: 1, opacity: 0.9,
          fill: false, interactive: false
        }
      }).addTo(map);

      kecFeatures.forEach(function(feature) {
        state.areaKm2[feature.properties.KECAMATAN] = turf.area(feature) / 1000000;
      });

      if (typeof rebuildAIAccessContext === 'function') {
        rebuildAIAccessContext();
      }
      loadAllData();
      if (typeof loadAIHistoricalContext === 'function') {
        loadAIHistoricalContext();
      }
    })
    .catch(e => { console.error('Gagal load puskesmas.geojson', e); showLoading(false); });
}, 50);

/* =========================================================
   11. STYLE + POPUP KECAMATAN
   ========================================================= */
function styleFeature(feature) {
  var kec = feature.properties.KECAMATAN;
  var value = getMapValue(kec);
  var maxVal = getMapMax();
  return {
    pane: 'pane_puskesmas',
    color: 'transparent', weight: 0,
    fillColor: getColor(value, maxVal),
    fillOpacity: 0.75
  };
}

function getMapValue(kecamatan) {
  var cases = Number(state.mapData[kecamatan]) || 0;
  if (state.mapMode !== 'density') return cases;
  var areaKm2 = Number(state.areaKm2[kecamatan]) || 0;
  return areaKm2 > 0 ? cases / areaKm2 : 0;
}

function getMapMax() {
  var values = Object.keys(state.mapData).map(getMapValue);
  return Math.max.apply(null, values.concat([0]));
}

function onEachFeature(feature, layer) {
  var kec = feature.properties.KECAMATAN;
  var pkmList = feature.properties.PUSKESMAS_LIST || [];

  layer.on('click', function() {
    var total = state.mapData[kec] || 0;
    var areaKm2 = Number(state.areaKm2[kec]) || 0;
    var density = areaKm2 > 0 ? total / areaKm2 : 0;
    var detail = state.barData[kec] || {
      laki_laki: '-', perempuan: '-',
      meninggal_laki_laki: '-', meninggal_perempuan: '-'
    };
    var html = '<h4>Kec. ' + kec + '</h4>' +
               '<div class="popup-sub">' +
               LABEL_PENYAKIT[state.penyakit] + ' - ' + state.tahun + '</div>' +
               '<div class="popup-sub" style="text-transform:none;color:#7f8c8d;">' +
               'Puskesmas (' + pkmList.length + '): ' + pkmList.join(' | ') +
               '</div>' +
               '<table>' +
               '<tr><td>Laki-laki</td><td>' + detail.laki_laki + '</td></tr>' +
               '<tr><td>Perempuan</td><td>' + detail.perempuan + '</td></tr>' +
               '<tr><td class="total-row"><b>Total Kasus</b></td>' +
               '<td class="total-row"><b>' + total + '</b></td></tr>' +
               '<tr><td>Luas Wilayah</td><td>' + areaKm2.toFixed(2) + ' km²</td></tr>' +
               '<tr><td>Kepadatan Kasus</td><td>' + density.toFixed(2) + ' kasus/km²</td></tr>';
    if (state.penyakit !== 'tb_baru') {
      html += '<tr><td>Meninggal (L)</td><td>' + detail.meninggal_laki_laki + '</td></tr>' +
              '<tr><td>Meninggal (P)</td><td>' + detail.meninggal_perempuan + '</td></tr>';
    }
    html += '</table>';

    this.bindPopup(html, {
      maxHeight: 400, autoPan: true,
      autoPanPaddingTopLeft: L.point(60, 60),
      autoPanPaddingBottomRight: L.point(360, 320),
      keepInView: true, offset: L.point(0, -10)
    }).openPopup();
  });

  layer.bindTooltip('Kec. ' + kec, {sticky: true});
}

/* =========================================================
   12. WARNA CHOROPLETH
   ========================================================= */
function getColor(value, maxVal) {
  if (maxVal <= 0) return '#f0f0f0';
  var ratio = value / maxVal;
  return ratio > 0.80 ? '#7f0000' :
         ratio > 0.60 ? '#d63031' :
         ratio > 0.40 ? '#e17055' :
         ratio > 0.20 ? '#fdcb6e' :
         ratio > 0.00 ? '#ffeaa7' : '#ffffff';
}
function getLegendGrades(maxVal, isDensity) {
  var grades = [0];
  if (maxVal <= 0) return [0, isDensity ? 0.01 : 1];
  for (var i = 1; i <= 5; i++) {
    var grade = maxVal * i / 5;
    grades.push(isDensity ? Number(grade.toFixed(2)) : Math.round(grade));
  }
  return grades;
}
function updateDiseaseLegend(maxVal, penyakit, tahun, mapMode) {
  var container = document.getElementById('legend-disease-items');
  var isDensity = mapMode === 'density';
  var grades = getLegendGrades(maxVal, isDensity);
  document.getElementById('disease-legend-title').textContent = isDensity
    ? 'Kepadatan Kasus per Kecamatan'
    : 'Jumlah Kasus per Kecamatan';
  var html = '<div style="font-size:10px;color:#95a5a6;margin-bottom:6px;">' +
             LABEL_PENYAKIT[penyakit] + ' - ' + tahun + '</div>';
  for (var i = 0; i < grades.length - 1; i++) {
    html += '<div class="legend-row">' +
            '<span class="swatch" style="background:' +
            getColor((grades[i] + grades[i + 1]) / 2, maxVal) + '"></span>' +
            '<span>' +
            (isDensity ? grades[i].toFixed(2) : grades[i]) + ' - ' +
            (isDensity ? grades[i + 1].toFixed(2) : grades[i + 1]) +
            (isDensity ? ' kasus/km²' : '') + '</span>' +
            '</div>';
  }
  container.innerHTML = html;
}

/* =========================================================
   13. LOAD DATA (dari Supabase + fallback JSON lokal)
   ========================================================= */
async function loadAllData() {
  showLoading(true);
  try {
    const { data: dbCases, error } = await supabaseClient
      .from('cases')
      .select('*')
      .eq('penyakit', state.penyakit)
      .eq('tahun', parseInt(state.tahun));

    const base = 'data/' + state.penyakit + '/';
    const [mapJson, barJson, lineJson] = await Promise.all([
      fetch(base + 'map_'  + state.tahun + '.json').then(r => r.json()),
      fetch(base + 'bar_'  + state.tahun + '.json').then(r => r.json()),
      fetch(base + 'line_' + state.tahun + '.json').then(r => r.json())
    ]);

    state.mapData = {};
    if (mapJson && mapJson.data) {
      mapJson.data.forEach(function(d) {
        var kec = KD_TO_KEC[d[0]];
        if (!kec) return;
        state.mapData[kec] = (state.mapData[kec] || 0) + d[1];
      });
    }

    if (!error && dbCases && dbCases.length) {
      dbCases.forEach(function(c) {
        var total = (c.laki_laki || 0) + (c.perempuan || 0);
        state.mapData[c.kecamatan] = total;
      });
    }

    state.barData = {};
    if (Array.isArray(barJson)) {
      barJson.forEach(function(d) {
        var kec = PKM_TO_KEC[d.name];
        if (!kec) return;
        if (!state.barData[kec]) {
          state.barData[kec] = {laki_laki: 0, perempuan: 0,
            meninggal_laki_laki: 0, meninggal_perempuan: 0};
        }
        state.barData[kec].laki_laki           += (d.laki_laki || 0);
        state.barData[kec].perempuan           += (d.perempuan || 0);
        state.barData[kec].meninggal_laki_laki += (d.meninggal_laki_laki || 0);
        state.barData[kec].meninggal_perempuan += (d.meninggal_perempuan || 0);
      });
    }

    if (!error && dbCases && dbCases.length) {
      dbCases.forEach(function(c) {
        state.barData[c.kecamatan] = {
          laki_laki: c.laki_laki || 0,
          perempuan: c.perempuan || 0,
          meninggal_laki_laki: c.meninggal_laki_laki || 0,
          meninggal_perempuan: c.meninggal_perempuan || 0
        };
      });
    }

    if (state.geojsonLayer) state.geojsonLayer.setStyle(styleFeature);

    var maxVal = getMapMax();
    updateDiseaseLegend(maxVal, state.penyakit, state.tahun, state.mapMode);
    updateMonthlyChart(lineJson, state.penyakit, state.tahun);
    window.AI_CASES_SOURCE = !error && dbCases && dbCases.length
      ? 'Supabase' : 'JSON lokal';
    window.AI_MONTHLY_CONTEXT = lineJson && Array.isArray(lineJson.data)
      ? {
          months: BULAN,
          series: lineJson.data.map(function(series) {
            return {
              name: series.name,
              values: (series.data || []).map(function(value, index) {
                return {month: BULAN[index] || 'Bulan ' + (index + 1), cases: Number(value) || 0};
              })
            };
          })
        }
      : {status: 'Data bulanan tidak tersedia.'};

    /* === KUNCI: rebuild AI system prompt dengan data yang baru === */
    if (typeof rebuildAISystemPrompt === 'function') {
      rebuildAISystemPrompt();
    }

  } catch (e) {
    console.error('Gagal load data', e);
  } finally {
    showLoading(false);
  }
}

/* =========================================================
   14. GRAFIK BULANAN
   ========================================================= */
var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun',
             'Jul','Agu','Sep','Okt','Nov','Des'];

function updateMonthlyChart(lineJson, penyakit, tahun) {
  if (state.chartInstance) state.chartInstance.destroy();
  var datasets = [];
  var palette = ['#0984e3','#00b894','#e17055','#c1306a','#d63031','#6c5ce7'];
  if (lineJson && lineJson.data && lineJson.data.length) {
    lineJson.data.forEach(function(series, i) {
      datasets.push({
        label: series.name, data: series.data,
        borderColor: palette[i % palette.length],
        backgroundColor: palette[i % palette.length] + '33',
        borderWidth: 2, tension: 0.3,
        fill: false, pointRadius: 2.5
      });
    });
  }
  var ctx = document.getElementById('monthly-chart').getContext('2d');
  state.chartInstance = new Chart(ctx, {
    type: 'line',
    data: {labels: BULAN, datasets: datasets},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: {position: 'bottom',
          labels: {font: {size: 9}, boxWidth: 10, padding: 4, usePointStyle: true}},
        tooltip: {mode: 'index', intersect: false,
          titleFont: {size: 10}, bodyFont: {size: 10}}
      },
      scales: {
        y: {beginAtZero: true, ticks: {font: {size: 9}, maxTicksLimit: 5}},
        x: {ticks: {font: {size: 9}}}
      }
    }
  });
}

/* =========================================================
   15. EVENT DROPDOWN

document.getElementById('select-tahun').addEventListener('change', function() {

   16. LOADING
   ========================================================= */

}

/* =========================================================
   17. INIT: AUTH + AI
   ========================================================= */
Auth.applyToPanel();

// Data ini dikirim sebagai konteks terstruktur, bukan instruksi dari browser.
window.AI_ACCESS_CONTEXT = null;
window.AI_ACCESS_LAYERS = null;
window.AI_MONTHLY_CONTEXT = null;
window.AI_CASES_SOURCE = 'JSON lokal';
window.AI_HISTORICAL_CONTEXT = {status: 'Data historis sedang dimuat dari Supabase.'};
window.AI_HISTORICAL_PROMISE = null;

window.loadAIHistoricalContext = function() {
  if (window.AI_HISTORICAL_PROMISE) return window.AI_HISTORICAL_PROMISE;

  window.AI_HISTORICAL_PROMISE = supabaseClient
    .from('cases')
    .select('penyakit,tahun,kecamatan,laki_laki,perempuan,meninggal_laki_laki,meninggal_perempuan')
    .gte('tahun', 2019)
    .lte('tahun', 2026)
    .then(function(result) {
      if (result.error) throw result.error;

      var groups = {};
      (result.data || []).forEach(function(row) {
        if (!LABEL_PENYAKIT[row.penyakit]) return;
        var tahun = Number(row.tahun);
        if (tahun < 2019 || tahun > 2026 || !row.kecamatan) return;
        var key = row.penyakit + ':' + tahun;
        if (!groups[key]) {
          groups[key] = {penyakit: row.penyakit, tahun: tahun, districts: {}};
        }
        var district = groups[key].districts[row.kecamatan];
        if (!district) {
          district = groups[key].districts[row.kecamatan] = {
            kecamatan: row.kecamatan,
            kasus: 0,
            lakiLaki: 0,
            perempuan: 0,
            meninggal: 0
          };
        }
        district.lakiLaki += Number(row.laki_laki) || 0;
        district.perempuan += Number(row.perempuan) || 0;
        district.meninggal += (Number(row.meninggal_laki_laki) || 0) +
          (Number(row.meninggal_perempuan) || 0);
        district.kasus = district.lakiLaki + district.perempuan;
      });

      var dataTahunan = Object.keys(groups).sort().map(function(key) {
        var group = groups[key];
        var districts = Object.keys(group.districts).map(function(name) {
          return group.districts[name];
        }).sort(function(a, b) {
          return b.kasus - a.kasus;
        });
        return {
          penyakit: LABEL_PENYAKIT[group.penyakit],
          tahun: group.tahun,
          totalKasus: districts.reduce(function(total, district) {
            return total + district.kasus;
          }, 0),
          kasusPerKecamatan: districts.map(function(district) {
            return [district.kecamatan, district.kasus];
          })
        };
      });

      window.AI_HISTORICAL_CONTEXT = {
        sumber: 'Supabase',
        cakupanTahun: '2019-2026',
        jumlahBaris: (result.data || []).length,
        dataTahunan: dataTahunan
      };
      console.log('[AI] Data historis dimuat:', dataTahunan.length, 'kombinasi penyakit-tahun');
      rebuildAISystemPrompt();
    })
    .catch(function(error) {
      console.warn('[AI] Gagal memuat data historis:', error.message);
      window.AI_HISTORICAL_CONTEXT = {status: 'Data historis Supabase tidak dapat dimuat.'};
      rebuildAISystemPrompt();
    });

  return window.AI_HISTORICAL_PROMISE;
};

/* Bangun ulang konteks setiap kali filter atau data peta berubah. */
window.rebuildAISystemPrompt = function() {
  if (!window.AIAssistant || typeof AIAssistant.updateContext !== 'function') {
    console.warn('[AI] Assistant belum siap');
    return;
  }

  var penyakit = LABEL_PENYAKIT[state.penyakit] || state.penyakit;
  var tahun = state.tahun;

  // Susun data kasus
  var entries = Object.entries(state.mapData || {});
  entries.sort(function(a, b) { return b[1] - a[1]; });

  var totalKasus = entries.reduce(function(total, entry) {
    return total + (Number(entry[1]) || 0);
  }, 0);
  var dataPerKecamatan = entries.map(function(entry) {
    var detail = state.barData[entry[0]] || {};
    return {
      kecamatan: entry[0],
      kasus: Number(entry[1]) || 0,
      lakiLaki: Number(detail.laki_laki) || 0,
      perempuan: Number(detail.perempuan) || 0,
      meninggal: (Number(detail.meninggal_laki_laki) || 0) +
        (Number(detail.meninggal_perempuan) || 0)
    };
  });
  var kasusPositif = entries.filter(function(entry) {
    return Number(entry[1]) > 0;
  });

  AIAssistant.updateContext({
    filterAktif: {penyakit: penyakit, tahun: tahun},
    sumberData: AI_CASES_SOURCE,
    ringkasan: {
      totalKasus: totalKasus,
      jumlahKecamatan: entries.length,
      tertinggi: entries.slice(0, 5).map(function(entry) {
        return {kecamatan: entry[0], kasus: Number(entry[1]) || 0};
      }),
      terendahPositif: kasusPositif.length
        ? {kecamatan: kasusPositif[kasusPositif.length - 1][0],
          kasus: Number(kasusPositif[kasusPositif.length - 1][1]) || 0}
        : null
    },
    kasusPerKecamatan: dataPerKecamatan,
    dataHistoris: AI_HISTORICAL_CONTEXT,
    trenBulanan: AI_MONTHLY_CONTEXT || {status: 'Data bulanan sedang dimuat.'},
    aksesibilitas: AI_ACCESS_CONTEXT || {status: 'Data aksesibilitas sedang dihitung.'}
  });

  console.log('[AI] Konteks diperbarui:', penyakit, tahun,
              '(' + entries.length + ' kecamatan)');
};

// Init AI dasar dulu
AIAssistant.init({
  penyakit: 'DBD',
  tahun: '2025',
  catatan: 'Memuat konteks...'
});

// Hitung aksesibilitas setelah geometri kecamatan selesai dimuat.
window.rebuildAIAccessContext = function() {
  try {
    var kecFeatures = [];
    if (state.geojsonLayer) {
      state.geojsonLayer.eachLayer(function(l) {
        kecFeatures.push(l.feature);
      });
    }

    var bufferLayers = window.AI_ACCESS_LAYERS;
    if (!bufferLayers) return;

    var konteksAkses = { sangat: [], terjangkau: [], jauh: [], tidak: [] };

    Object.keys(bufferLayers).forEach(function(zona) {
      var bufLayer = bufferLayers[zona];
      if (!bufLayer || kecFeatures.length === 0) return;
      var bufGeoJSON = bufLayer.toGeoJSON();
      var bufGeom = bufGeoJSON.type === 'FeatureCollection'
        ? bufGeoJSON.features[0]
        : bufGeoJSON;
      if (!bufGeom || !bufGeom.geometry) return;

      kecFeatures.forEach(function(kec) {
        try {
          var irisan = turf.intersect(kec, bufGeom);
          if (irisan && turf.area(irisan) > 10000) {
            var namaKec = kec.properties.KECAMATAN;
            if (konteksAkses[zona].indexOf(namaKec) === -1) {
              konteksAkses[zona].push(namaKec);
            }
          }
        } catch (e) { /* skip */ }
      });
    });

    AI_ACCESS_CONTEXT = konteksAkses;
    console.log('Konteks aksesibilitas:', konteksAkses);

    rebuildAISystemPrompt();
  } catch (err) {
    console.warn('Gagal bangun konteks aksesibilitas:', err);
  }
};
