<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/leaflet.css">
  <link rel="stylesheet" href="css/qgis2web.css">
  <link rel="stylesheet" href="css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/leaflet.photon.css">
  <link rel="stylesheet" href="css/leaflet-measure.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    html, body, #map {
      width: 100%; height: 100%; padding: 0; margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    #right-panel {
      position: absolute;
      top: 12px; right: 12px; bottom: 12px;
      z-index: 1000; width: 330px;
      background: rgba(255,255,255,0.98);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #right-panel-body {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 12px;
    }
    #right-panel-body::-webkit-scrollbar { width: 6px; }
    #right-panel-body::-webkit-scrollbar-thumb {
      background: #dfe6e9; border-radius: 3px;
    }

    .panel-section { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; }
    .section-header {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; color: #2c3e50;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .section-header i { color: #3498db; font-size: 12px; }

    .panel-section label.form-label {
      display: block; font-size: 10px; font-weight: 600;
      color: #7f8c8d; margin: 6px 0 3px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .panel-section select {
      width: 100%; padding: 7px 10px; font-size: 12px;
      border: 1px solid #dfe6e9; border-radius: 6px;
      background: #fff; color: #2c3e50; cursor: pointer;
    }
    .panel-section select:focus {
      outline: none; border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
    }

    .layer-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; cursor: pointer; font-size: 12px;
      color: #2c3e50; user-select: none;
    }
    .layer-item:hover { color: #3498db; }
    .layer-item input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px;
      border: 2px solid #b2bec3; border-radius: 4px;
      cursor: pointer; position: relative; flex-shrink: 0;
    }
    .layer-item input[type="checkbox"]:checked {
      background: #3498db; border-color: #3498db;
    }
    .layer-item input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 3.5px; top: 0.5px;
      width: 5px; height: 9px;
      border: solid white; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .layer-swatch {
      width: 18px; height: 12px; border: 2.5px solid #333;
      background: transparent; flex-shrink: 0; border-radius: 2px;
    }

    /* Swatch RS: plus merah dengan outline putih */
    .layer-swatch.rs-plus {
      width: 16px; height: 16px;
      border: none;
      background: transparent;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M10 2 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 v-6 h8 z' fill='%23e74c3c' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .legend-subtitle {
      font-size: 10px; font-weight: 600; color: #7f8c8d;
      text-transform: uppercase; letter-spacing: 0.3px;
      margin: 8px 0 4px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
      padding: 2px 0; font-size: 11px; color: #2c3e50;
    }
    .legend-row .swatch {
      width: 18px; height: 12px;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 2px; flex-shrink: 0;
    }

    #chart-wrapper { position: relative; height: 170px; width: 100%; }
    #chart-wrapper canvas { width: 100% !important; height: 100% !important; }

    .leaflet-control-zoom { border-radius: 8px !important; overflow: hidden; }
    .leaflet-control-zoom a {
      background: rgba(255,255,255,0.95) !important;
      color: #2c3e50 !important;
      border-color: #dfe6e9 !important;
    }
    .leaflet-control-layers { display: none !important; }

    /* Marker RS custom (divIcon) */
    .rs-marker { background: transparent; border: none; }
    .rs-marker svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }

    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .leaflet-popup-content {
      font-size: 12px; line-height: 1.5;
      margin: 12px 16px; min-width: 200px;
    }
    .leaflet-popup-content h4 {
      margin: 0 0 6px; color: #2c3e50; font-size: 13px;
      padding-bottom: 6px; border-bottom: 1px solid #ecf0f1;
    }
    .leaflet-popup-content .popup-sub {
      font-size: 10px; color: #95a5a6; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .leaflet-popup-content .pkm-list {
      font-size: 10px; color: #7f8c8d;
      background: #f8f9fa; padding: 6px 8px;
      border-radius: 6px; margin-bottom: 8px;
      line-height: 1.4;
    }
    .leaflet-popup-content table {
      border-collapse: collapse; width: 100%;
    }
    .leaflet-popup-content td { padding: 3px 4px; font-size: 12px; }
    .leaflet-popup-content td:first-child { color: #7f8c8d; }
    .leaflet-popup-content td:last-child {
      font-weight: 600; text-align: right; color: #c0392b;
    }
    .leaflet-popup-content td.total-row { color: #2c3e50; }
    .leaflet-popup-content td.total-row:last-child {
      color: #c0392b; font-size: 14px;
    }

    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      z-index: 2000;
      background: rgba(44,62,80,0.85); color: #fff;
      padding: 12px 24px; border-radius: 8px;
      font-size: 13px; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    @media (max-width: 700px) {
      #right-panel { width: 260px; top: 8px; right: 8px; bottom: 8px; }
      .panel-section { padding: 8px 10px; }
    }
  </style>

  <title>WebGIS Dinamika Penyakit Menular Kota Semarang</title>
</head>
<body>

  <div id="map"></div>

  <div id="right-panel">
    <div id="right-panel-body">

      <div class="panel-section">
        <div class="section-header">
          <i class="fas fa-map-marked-alt"></i> Dinamika Penyakit
        </div>
        <label class="form-label" for="select-penyakit">Jenis Penyakit</label>
        <select id="select-penyakit">
          <option value="leptospirosis">Leptospirosis</option>
          <option value="tb_baru">TB Baru</option>
          <option value="dbd" selected>DBD (Demam Berdarah)</option>
        </select>
        <label class="form-label" for="select-tahun">Tahun</label>
        <select id="select-tahun">
          <option>2019</option><option>2020</option><option>2021</option>
          <option>2022</option><option>2023</option><option>2024</option>
          <option selected>2025</option><option>2026</option>
        </select>
      </div>

      <div class="panel-section">
        <div class="section-header">
          <i class="fas fa-layer-group"></i> Layer Aksesibilitas
        </div>

        <label class="layer-item">
          <input type="checkbox" data-layer="rs">
          <span class="layer-swatch rs-plus"></span>
          Rumah Sakit
        </label>

        <label class="layer-item">
          <input type="checkbox" data-layer="sangat">
          <span class="layer-swatch" style="border-color:#00c853;"></span>
          Sangat Terjangkau (&lt;1 km)
        </label>
        <label class="layer-item">
          <input type="checkbox" data-layer="terjangkau">
          <span class="layer-swatch" style="border-color:#ffd600;"></span>
          Terjangkau (1–3 km)
        </label>
        <label class="layer-item">
          <input type="checkbox" data-layer="jauh">
          <span class="layer-swatch" style="border-color:#ff6d00;"></span>
          Jauh (3–5 km)
        </label>
        <label class="layer-item">
          <input type="checkbox" data-layer="tidak">
          <span class="layer-swatch" style="border-color:#d50000;"></span>
          Tidak Terjangkau (&gt;5 km)
        </label>
      </div>

      <div class="panel-section">
        <div class="section-header">
          <i class="fas fa-list-ul"></i> Legenda
        </div>
        <div class="legend-subtitle">Jumlah Kasus per Kecamatan</div>
        <div id="legend-disease-items"></div>
      </div>

      <div class="panel-section">
        <div class="section-header">
          <i class="fas fa-chart-line"></i> Kasus Bulanan
        </div>
        <div id="chart-wrapper">
          <canvas id="monthly-chart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <div id="loading">Memuat data...</div>

  <script src="js/qgis2web_expressions.js"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/leaflet.rotatedMarker.js"></script>
  <script src="js/leaflet.pattern.js"></script>
  <script src="js/leaflet-hash.js"></script>
  <script src="js/Autolinker.min.js"></script>
  <script src="js/rbush.min.js"></script>
  <script src="js/labelgun.min.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/leaflet.photon.js"></script>

  <script src="data/TidakTerjangkau_1.js"></script>
  <script src="data/Jauh_2.js"></script>
  <script src="data/Terjangkau_3.js"></script>
  <script src="data/SangatTerjangkau_4.js"></script>
  <script src="data/RumahSakit_5.js"></script>

  <script>
  /* =========================================================
     1. PETA & KONTROL
     ========================================================= */
  var map = L.map('map', {
    zoomControl: false, maxZoom: 28, minZoom: 1
  }).setView([-6.9932, 110.4203], 11);

  var hash = new L.Hash(map);
  map.attributionControl.setPrefix(
    '<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> ' +
    '&middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>'
  );
  var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});


  /* =========================================================
     2. PANES
     ========================================================= */
  map.createPane('pane_GoogleSatellite_0');
  map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;

  map.createPane('pane_puskesmas');
  map.getPane('pane_puskesmas').style.zIndex = 405;

  map.createPane('pane_SangatTerjangkau');
  map.getPane('pane_SangatTerjangkau').style.zIndex = 410;
  map.createPane('pane_Terjangkau');
  map.getPane('pane_Terjangkau').style.zIndex = 411;
  map.createPane('pane_Jauh');
  map.getPane('pane_Jauh').style.zIndex = 412;
  map.createPane('pane_TidakTerjangkau');
  map.getPane('pane_TidakTerjangkau').style.zIndex = 413;
  map.createPane('pane_RumahSakit');
  map.getPane('pane_RumahSakit').style.zIndex = 415;

  map.createPane('pane_kec_outline');
  map.getPane('pane_kec_outline').style.zIndex = 420;
  map.getPane('pane_kec_outline').style.pointerEvents = 'none';

  /* =========================================================
     3. BASEMAP
     ========================================================= */
  L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    pane: 'pane_GoogleSatellite_0',
    opacity: 1.0, attribution: '',
    minZoom: 1, maxZoom: 28,
    minNativeZoom: 0, maxNativeZoom: 19
  }).addTo(map);

  /* =========================================================
     4. DISSOLVE HELPER (Turf.js)
     ========================================================= */
  function dissolveGeoJSON(geojsonData) {
    if (!geojsonData || !geojsonData.features || geojsonData.features.length === 0) {
      return null;
    }
    var features = geojsonData.features;
    var merged = features[0];
    for (var i = 1; i < features.length; i++) {
      try {
        var result = turf.union(merged, features[i]);
        if (result) merged = result;
      } catch (e) {
        console.warn('Union gagal pada index ' + i, e);
      }
    }
    return merged;
  }

  /* =========================================================
     5. STYLE BUFFER (HOLLOW)
     ========================================================= */
  var STYLE = {
    sangat:     { color: '#00c853', weight: 2.5, fillColor: '#00c853', fillOpacity: 0.10, dashArray: '' },
    terjangkau: { color: '#ffd600', weight: 2.5, fillColor: '#ffd600', fillOpacity: 0.10, dashArray: '' },
    jauh:       { color: '#ff6d00', weight: 2.5, fillColor: '#ff6d00', fillOpacity: 0.10, dashArray: '' },
    tidak:      { color: '#d50000', weight: 2.5, fillColor: '#d50000', fillOpacity: 0.10, dashArray: '4,4' }
  };

  function paneName(key) {
    return {
      sangat: 'pane_SangatTerjangkau',
      terjangkau: 'pane_Terjangkau',
      jauh: 'pane_Jauh',
      tidak: 'pane_TidakTerjangkau'
    }[key];
  }

  function styleBufferFixed(key) {
    return function() {
      var s = STYLE[key];
      return {
        pane: paneName(key),
        color: s.color, weight: s.weight, opacity: 1,
        fillColor: s.fillColor, fillOpacity: s.fillOpacity,
        dashArray: s.dashArray,
        lineCap: 'round', lineJoin: 'round'
      };
    };
  }

  /* Popup generic untuk zona buffer (setelah dissolve, properti puskesmas hilang) */
  function makeDissolvedBufferPopup(label, color) {
    return function(feature, layer) {
      var html = '<h4 style="color:' + color + ';">Zona Buffer</h4>' +
                 '<div class="popup-sub">' + label + '</div>' +
                 '<div style="font-size:11px;color:#7f8c8d;line-height:1.5;">' +
                 'Area yang tergabung dari seluruh puskesmas dalam radius ini.</div>';
      layer.bindPopup(html, {
        maxHeight: 300, autoPan: true,
        autoPanPaddingTopLeft: L.point(60, 60),
        autoPanPaddingBottomRight: L.point(360, 320),
        keepInView: true
      });
    };
  }

  /* =========================================================
     6. BUAT BUFFER LAYER — DISSOLVED
     ========================================================= */
  showLoading(true);

  // Tunggu DOM render dulu, baru proses dissolve (agak berat)
  setTimeout(function() {
    // ---- Sangat Terjangkau ----
    var dissolvedSangat = dissolveGeoJSON(json_SangatTerjangkau_4);
    var layer_SangatTerjangkau = L.geoJson(dissolvedSangat, {
      pane: 'pane_SangatTerjangkau',
      style: styleBufferFixed('sangat'),
      onEachFeature: makeDissolvedBufferPopup('Sangat Terjangkau (<1 km)', '#00c853')
    });

    // ---- Terjangkau ----
    var dissolvedTerjangkau = dissolveGeoJSON(json_Terjangkau_3);
    var layer_Terjangkau = L.geoJson(dissolvedTerjangkau, {
      pane: 'pane_Terjangkau',
      style: styleBufferFixed('terjangkau'),
      onEachFeature: makeDissolvedBufferPopup('Terjangkau (1–3 km)', '#ffd600')
    });

    // ---- Jauh ----
    var dissolvedJauh = dissolveGeoJSON(json_Jauh_2);
    var layer_Jauh = L.geoJson(dissolvedJauh, {
      pane: 'pane_Jauh',
      style: styleBufferFixed('jauh'),
      onEachFeature: makeDissolvedBufferPopup('Jauh (3–5 km)', '#ff6d00')
    });

    // ---- Tidak Terjangkau ----
    var dissolvedTidak = dissolveGeoJSON(json_TidakTerjangkau_1);
    var layer_TidakTerjangkau = L.geoJson(dissolvedTidak, {
      pane: 'pane_TidakTerjangkau',
      style: styleBufferFixed('tidak'),
      onEachFeature: makeDissolvedBufferPopup('Tidak Terjangkau (>5 km)', '#d50000')
    });

    /* =========================================================
       7. RS MARKER — PLUS MERAH + OUTLINE PUTIH
       ========================================================= */
    var rsIcon = L.divIcon({
      className: 'rs-marker',
      html: '<svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">' +
            '<path d="M10 2 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 v-6 h8 z" ' +
            'fill="#e74c3c" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>' +
            '</svg>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
      popupAnchor: [0, -13]
    });

    var layer_RumahSakit = L.geoJson(json_RumahSakit_5, {
      pane: 'pane_RumahSakit',
      pointToLayer: function(feature, latlng) {
        return L.marker(latlng, {
          pane: 'pane_RumahSakit',
          icon: rsIcon,
          riseOnHover: true
        });
      },
      onEachFeature: function(feature, layer) {
        var p = feature.properties || {};
        var nama = p.name || p.official_n || 'Rumah Sakit';
        var html = '<h4>' + nama + '</h4>' +
                   '<div class="popup-sub" style="color:#e74c3c;">Rumah Sakit</div>';
        if (p.addr_full) html += '📍 ' + p.addr_full + '<br>';
        if (p.contact_ph) html += '📞 ' + p.contact_ph + '<br>';
        if (p.website)   html += '🌐 ' + p.website;
        layer.bindPopup(html, {maxHeight: 300, autoPan: true,
          autoPanPaddingBottomRight: L.point(360, 320)});
        layer.bindTooltip(nama, {sticky: true});
      }
    });

    /* =========================================================
       8. BIND CHECKBOX → LAYER
       ========================================================= */
    var layerMap = {
      'rs': layer_RumahSakit,
      'sangat': layer_SangatTerjangkau,
      'terjangkau': layer_Terjangkau,
      'jauh': layer_Jauh,
      'tidak': layer_TidakTerjangkau
    };
    document.querySelectorAll('input[data-layer]').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var layer = layerMap[this.dataset.layer];
        if (!layer) return;
        if (this.checked) layer.addTo(map);
        else map.removeLayer(layer);
      });
    });

    /* =========================================================
       9. STATE
       ========================================================= */
    window.state = {
      penyakit: 'dbd', tahun: '2025',
      mapData: {}, barData: {},
      geojsonLayer: null, outlineLayer: null, chartInstance: null
    };
    window.LABEL_PENYAKIT = {
      'leptospirosis': 'Leptospirosis',
      'tb_baru': 'TB Baru', 'dbd': 'DBD'
    };
    window.KD_TO_KEC = {};
    window.PKM_TO_KEC = {};

    /* =========================================================
       10. LOAD PUSKESMAS → DISSOLVE KE KECAMATAN
       ========================================================= */
    fetch('data/puskesmas.geojson')
      .then(function(r) { return r.json(); })
      .then(function(gj) {
        gj.features.forEach(function(f) {
          var kd  = f.properties.KD_PUSK;
          var pkm = f.properties.PUSKESMAS;
          var kec = f.properties.KEC;
          if (kd)  window.KD_TO_KEC[kd] = kec;
          if (pkm) window.PKM_TO_KEC[pkm] = kec;
        });

        // Group by kecamatan
        var groups = {};
        gj.features.forEach(function(f) {
          var kec = f.properties.KEC;
          if (!kec) return;
          if (!groups[kec]) groups[kec] = [];
          groups[kec].push(f);
        });

        // Dissolve
        var kecFeatures = [];
        Object.keys(groups).forEach(function(kec) {
          var feats = groups[kec];
          var merged = feats[0];
          for (var i = 1; i < feats.length; i++) {
            try {
              var r = turf.union(merged, feats[i]);
              if (r) merged = r;
            } catch (e) {
              console.warn('Union gagal untuk ' + kec + ' idx ' + i, e);
            }
          }
          merged.properties = {
            KECAMATAN: kec,
            PUSKESMAS_LIST: feats.map(function(f) { return f.properties.PUSKESMAS; }),
            KD_PUSK_LIST: feats.map(function(f) { return f.properties.KD_PUSK; }),
            N_PUSKESMAS: feats.length
          };
          kecFeatures.push(merged);
        });

        var kecGeoJSON = {type: 'FeatureCollection', features: kecFeatures};

        // Choropleth (fill)
        state.geojsonLayer = L.geoJSON(kecGeoJSON, {
          pane: 'pane_puskesmas',
          style: styleFeature,
          onEachFeature: onEachFeature
        }).addTo(map);

        // Outline (garis, di atas semua)
        state.outlineLayer = L.geoJSON(kecGeoJSON, {
          pane: 'pane_kec_outline',
          style: {
            pane: 'pane_kec_outline',
            color: '#000000', weight: 1, opacity: 0.9,
            fill: false, interactive: false
          }
        }).addTo(map);

        loadAllData();
      })
      .catch(function(e) {
        console.error('Gagal load puskesmas.geojson:', e);
        showLoading(false);
      });
  }, 50);

  /* =========================================================
     11. STYLING & POPUP KECAMATAN
     ========================================================= */
  function styleFeature(feature) {
    var kec = feature.properties.KECAMATAN;
    var value = state.mapData[kec] || 0;
    var maxVal = Math.max.apply(null, Object.values(state.mapData).concat([1]));
    return {
      pane: 'pane_puskesmas',
      color: 'transparent', weight: 0,
      fillColor: getColor(value, maxVal),
      fillOpacity: 0.75
    };
  }

  function onEachFeature(feature, layer) {
    var kec = feature.properties.KECAMATAN;
    var pkmList = feature.properties.PUSKESMAS_LIST || [];

    layer.on('click', function() {
      var total = state.mapData[kec] || 0;
      var detail = state.barData[kec] || {
        laki_laki: '-', perempuan: '-',
        meninggal_laki_laki: '-', meninggal_perempuan: '-'
      };
      var html = '<h4>Kec. ' + kec + '</h4>' +
                 '<div class="popup-sub">' +
                 LABEL_PENYAKIT[state.penyakit] + ' — ' + state.tahun + '</div>' +
                 '<div class="pkm-list">' +
                 '<b>Puskesmas (' + pkmList.length + '):</b><br>' +
                 pkmList.join(' · ') +
                 '</div>' +
                 '<table>' +
                 '<tr><td>Laki-laki</td><td>' + detail.laki_laki + '</td></tr>' +
                 '<tr><td>Perempuan</td><td>' + detail.perempuan + '</td></tr>' +
                 '<tr><td class="total-row"><b>Total Kasus</b></td>' +
                 '<td class="total-row"><b>' + total + '</b></td></tr>';
      if (state.penyakit !== 'tb_baru') {
        html += '<tr><td>Meninggal (L)</td><td>' + detail.meninggal_laki_laki + '</td></tr>' +
                '<tr><td>Meninggal (P)</td><td>' + detail.meninggal_perempuan + '</td></tr>';
      }
      html += '</table>';

      this.bindPopup(html, {
        maxHeight: 400, autoPan: true,
        autoPanPaddingTopLeft: L.point(60, 60),
        autoPanPaddingBottomRight: L.point(360, 320),
        keepInView: true, offset: L.point(0, -10)
      }).openPopup();
    });

    layer.bindTooltip('Kec. ' + kec, {sticky: true});
  }

  /* =========================================================
     12. WARNA CHOROPLETH
     ========================================================= */
  function getColor(value, maxVal) {
    if (maxVal <= 0) return '#f0f0f0';
    var ratio = value / maxVal;
    return ratio > 0.80 ? '#7f0000' :
           ratio > 0.60 ? '#d63031' :
           ratio > 0.40 ? '#e17055' :
           ratio > 0.20 ? '#fdcb6e' :
           ratio > 0.00 ? '#ffeaa7' : '#ffffff';
  }
  function getLegendGrades(maxVal) {
    var grades = [0];
    if (maxVal <= 0) return [0, 1];
    for (var i = 1; i <= 5; i++) grades.push(Math.round(maxVal * i / 5));
    return grades;
  }
  function updateDiseaseLegend(maxVal, penyakit, tahun) {
    var container = document.getElementById('legend-disease-items');
    var grades = getLegendGrades(maxVal);
    var html = '<div style="font-size:10px;color:#95a5a6;margin-bottom:6px;">' +
               LABEL_PENYAKIT[penyakit] + ' — ' + tahun + '</div>';
    for (var i = 0; i < grades.length - 1; i++) {
      html += '<div class="legend-row">' +
              '<span class="swatch" style="background:' +
              getColor(grades[i] + 1, maxVal) + '"></span>' +
              '<span>' + grades[i] + ' – ' + grades[i + 1] + '</span>' +
              '</div>';
    }
    container.innerHTML = html;
  }

  /* =========================================================
     13. LOAD DATA + AGGREGATE
     ========================================================= */
  function loadAllData() {
    showLoading(true);
    var base = 'data/' + state.penyakit + '/';
    var mapUrl  = base + 'map_'  + state.tahun + '.json';
    var barUrl  = base + 'bar_'  + state.tahun + '.json';
    var lineUrl = base + 'line_' + state.tahun + '.json';

    Promise.all([
      fetch(mapUrl).then(function(r){return r.json();}),
      fetch(barUrl).then(function(r){return r.json();}),
      fetch(lineUrl).then(function(r){return r.json();})
    ])
    .then(function(results) {
      var mapJson = results[0], barJson = results[1], lineJson = results[2];

      // Aggregate map data per kecamatan
      state.mapData = {};
      if (mapJson && mapJson.data) {
        mapJson.data.forEach(function(d) {
          var kec = KD_TO_KEC[d[0]];
          if (!kec) return;
          state.mapData[kec] = (state.mapData[kec] || 0) + d[1];
        });
      }

      // Aggregate bar data per kecamatan
      state.barData = {};
      if (Array.isArray(barJson)) {
        barJson.forEach(function(d) {
          var kec = PKM_TO_KEC[d.name];
          if (!kec) return;
          if (!state.barData[kec]) {
            state.barData[kec] = {
              laki_laki: 0, perempuan: 0,
              meninggal_laki_laki: 0, meninggal_perempuan: 0
            };
          }
          state.barData[kec].laki_laki           += (d.laki_laki || 0);
          state.barData[kec].perempuan           += (d.perempuan || 0);
          state.barData[kec].meninggal_laki_laki += (d.meninggal_laki_laki || 0);
          state.barData[kec].meninggal_perempuan += (d.meninggal_perempuan || 0);
        });
      }

      if (state.geojsonLayer) state.geojsonLayer.setStyle(styleFeature);

      var maxVal = Math.max.apply(null, Object.values(state.mapData).concat([1]));
      updateDiseaseLegend(maxVal, state.penyakit, state.tahun);

      updateMonthlyChart(lineJson, state.penyakit, state.tahun);
      showLoading(false);
    })
    .catch(function(e) {
      console.error('Gagal load data:', e);
      showLoading(false);
    });
  }

  /* =========================================================
     14. GRAFIK BULANAN
     ========================================================= */
  var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun',
               'Jul','Agu','Sep','Okt','Nov','Des'];

  function updateMonthlyChart(lineJson, penyakit, tahun) {
    if (state.chartInstance) state.chartInstance.destroy();
    var datasets = [];
    var palette = ['#0984e3', '#00b894', '#e17055', '#c1306a', '#d63031', '#6c5ce7'];

    if (lineJson && lineJson.data && lineJson.data.length) {
      lineJson.data.forEach(function(series, i) {
        datasets.push({
          label: series.name, data: series.data,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length] + '33',
          borderWidth: 2, tension: 0.3,
          fill: false, pointRadius: 2.5
        });
      });
    }

    var ctx = document.getElementById('monthly-chart').getContext('2d');
    state.chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: BULAN, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { font: { size: 9 }, boxWidth: 10, padding: 6, usePointStyle: true }
          },
          tooltip: { mode: 'index', intersect: false,
                     titleFont: {size: 10}, bodyFont: {size: 10} }
        },
        scales: {
          y: { beginAtZero: true, ticks: { font: { size: 9 }, maxTicksLimit: 5 } },
          x: { ticks: { font: { size: 9 } } }
        }
      }
    });
  }

  /* =========================================================
     15. EVENT DROPDOWN
     ========================================================= */
  document.getElementById('select-penyakit').addEventListener('change', function() {
    state.penyakit = this.value; loadAllData();
  });
  document.getElementById('select-tahun').addEventListener('change', function() {
    state.tahun = this.value; loadAllData();
  });

  /* =========================================================
     16. LOADING
     ========================================================= */
  function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
  }

  </script>
</body>
