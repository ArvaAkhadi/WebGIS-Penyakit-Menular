<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cek Data Laporan - Admin</title>
  <link rel="icon" href="assests/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    .verify-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .verify-card {
      background: #fff; border-radius: 10px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .verify-card-header {
      padding: 14px 20px;
      background: #f8f9fa;
      border-bottom: 1px solid #ecf0f1;
      font-size: 14px; font-weight: 700;
    }
    .verify-card-body { padding: 0; overflow-x: auto; }
    .empty-state {
      padding: 40px; text-align: center;
      color: var(--text-mid); font-size: 13px;
    }
  </style>
</head>
<body>

<div class="form-page">
  <div class="form-topbar">
    <a href="map.html"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
    <span>Verifikasi Laporan Kasus Penyakit Menular - Kota Semarang</span>
  </div>

  <div class="verify-container">
    <div class="verify-card">
      <div class="verify-card-header">
        Cek Data Laporan Kasus (Admin) — Daftar Laporan Masuk
      </div>
      <div class="verify-card-body">
        <div id="verify-alert"></div>
        <table class="verify-table" id="verify-table">
          <thead>
            <tr>
              <th>ID Laporan</th>
              <th>Informan</th>
              <th>Penderita</th>
              <th>Domisili</th>
              <th>Kondisi</th>
              <th>Penyakit</th>
              <th>Waktu Lapor</th>
              <th>Status</th>
              <th>Aksi Verifikasi</th>
            </tr>
          </thead>
          <tbody id="verify-body">
            <tr><td colspan="9" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
if (!Auth.requireAdmin()) throw new Error('Bukan admin');

async function loadReports() {
  const tbody = document.getElementById('verify-body');
  try {
    const { data, error } = await supabaseClient
      .from('reports')
      .select('*')
      .order('created_at', {ascending: false});

    if (error) throw error;
    if (!data || !data.length) {
      tbody.innerHTML =
        '<tr><td colspan="9" class="empty-state">Belum ada laporan masuk.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(r => {
      const statusClass = {
        'Menunggu Verifikasi': 'status-menunggu',
        'Disetujui': 'status-disetujui',
        'Ditolak': 'status-ditolak'
      }[r.status] || 'status-menunggu';

      const actions = r.status === 'Menunggu Verifikasi' ?
        '<button class="btn-approve" onclick="approve(\'' + r.id + '\')">✓ Terima</button>' +
        '<button class="btn-reject" onclick="reject(\'' + r.id + '\')">✕ Tolak</button>' :
        '<span style="font-size:11px;color:#7f8c8d;">Sudah diproses</span>';

      return '<tr>' +
        '<td>' + r.id.substring(0, 8) + '…</td>' +
        '<td>' + (r.informan_nama || '-') + '<br>' +
          '<small style="color:#95a5a6;">' + (r.informan_kontak || '') + '</small></td>' +
        '<td>' + r.penderita_nama + '<br>' +
          '<small style="color:#95a5a6;">' + (r.jenis_kelamin || '') + '</small></td>' +
        '<td>' + (r.kecamatan || '-') + '</td>' +
        '<td>' + (r.kondisi || '-') + '</td>' +
        '<td>' + (r.penyakit || '-').toUpperCase() + '</td>' +
        '<td>' + new Date(r.created_at).toLocaleString('id-ID') + '</td>' +
        '<td><span class="status-badge ' + statusClass + '">' + r.status + '</span></td>' +
        '<td>' + actions + '</td>' +
        '</tr>';
    }).join('');
  } catch (e) {
    console.error(e);
    tbody.innerHTML =
      '<tr><td colspan="9" class="empty-state" style="color:#c0392b;">Error: ' +
      e.message + '</td></tr>';
  }
}

window.approve = async function(id) {
  if (!confirm('Setujui laporan ini dan tambahkan ke data kasus?')) return;
  try {
    // Ambil laporan
    const { data: rep } = await supabaseClient
      .from('reports').select('*').eq('id', id).single();

    // Update status
    await supabaseClient.from('reports').update({
      status: 'Disetujui',
      verified_at: new Date().toISOString()
    }).eq('id', id);

    // Tambahkan / update ke tabel cases
    const tahun = new Date().getFullYear();
    const { data: existing } = await supabaseClient
      .from('cases')
      .select('*')
      .eq('kecamatan', rep.kecamatan)
      .eq('penyakit', rep.penyakit)
      .eq('tahun', tahun)
      .maybeSingle();

    const inc = {
      laki_laki: (rep.jenis_kelamin === 'Laki-laki' && rep.kondisi !== 'Meninggal') ? 1 : 0,
      perempuan: (rep.jenis_kelamin === 'Perempuan' && rep.kondisi !== 'Meninggal') ? 1 : 0,
      meninggal_laki_laki: (rep.jenis_kelamin === 'Laki-laki' && rep.kondisi === 'Meninggal') ? 1 : 0,
      meninggal_perempuan: (rep.jenis_kelamin === 'Perempuan' && rep.kondisi === 'Meninggal') ? 1 : 0
    };

    if (existing) {
      await supabaseClient.from('cases').update({
        laki_laki: (existing.laki_laki || 0) + inc.laki_laki,
        perempuan: (existing.perempuan || 0) + inc.perempuan,
        meninggal_laki_laki: (existing.meninggal_laki_laki || 0) + inc.meninggal_laki_laki,
        meninggal_perempuan: (existing.meninggal_perempuan || 0) + inc.meninggal_perempuan,
        updated_at: new Date().toISOString()
      }).eq('id', existing.id);
    } else {
      await supabaseClient.from('cases').insert([{
        kecamatan: rep.kecamatan,
        penyakit: rep.penyakit,
        tahun,
        ...inc
      }]);
    }

    loadReports();
  } catch (e) {
    alert('Gagal menyetujui: ' + e.message);
  }
};

window.reject = async function(id) {
  if (!confirm('Tolak laporan ini dan hapus dari database?')) return;
  try {
    await supabaseClient.from('reports').delete().eq('id', id);
    loadReports();
  } catch (e) {
    alert('Gagal menolak: ' + e.message);
  }
};

loadReports();
</script>
</body>
</html>
