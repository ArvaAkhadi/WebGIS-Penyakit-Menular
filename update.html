<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Data Kasus - Admin</title>
  <link rel="icon" href="assests/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="form-page">
  <div class="form-topbar">
    <a href="map.html"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
    <span>Update Data Kasus Penyakit Menular - Kota Semarang</span>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-box-header">Formulir Pemutakhiran Data Kasus</div>
      <div class="form-box-body">
        <div id="update-alert"></div>

        <form id="update-form">
          <div class="form-subsection-title">Informasi Pengisi Data</div>
          <div class="form-row">
            <label for="pengisi">Nama / Instansi Pengisi</label>
            <input type="text" id="pengisi" class="form-control"
                   placeholder="Nama / instansi pengisi data" required>
          </div>

          <div class="form-subsection-title">Data Kasus</div>
          <div class="form-row">
            <label for="u_penyakit">Jenis Penyakit</label>
            <select id="u_penyakit" class="form-control" required>
              <option value="dbd" selected>DBD (Demam Berdarah)</option>
              <option value="leptospirosis">Leptospirosis</option>
              <option value="tb_baru">TB Baru</option>
            </select>
          </div>
          <div class="form-row">
            <label for="u_tahun">Tahun</label>
            <select id="u_tahun" class="form-control" required>
              <option>2019</option><option>2020</option><option>2021</option>
              <option>2022</option><option>2023</option><option>2024</option>
              <option selected>2025</option><option>2026</option>
            </select>
          </div>
          <div class="form-row">
            <label for="u_kecamatan">Kecamatan</label>
            <select id="u_kecamatan" class="form-control" required>
              <option value="">— Pilih Kecamatan —</option>
              <option>Semarang Tengah</option>
              <option>Semarang Barat</option>
              <option>Semarang Timur</option>
              <option>Semarang Utara</option>
              <option>Semarang Selatan</option>
              <option>Gajahmungkur</option>
              <option>Candisari</option>
              <option>Gayamsari</option>
              <option>Genuk</option>
              <option>Pedurungan</option>
              <option>Tembalang</option>
              <option>Banyumanik</option>
              <option>Gunungpati</option>
              <option>Mijen</option>
              <option>Ngaliyan</option>
              <option>Tugu</option>
            </select>
          </div>
          <div class="form-row">
            <label for="u_laki">Jumlah Laki-laki</label>
            <input type="number" id="u_laki" class="form-control" value="0" min="0" required>
          </div>
          <div class="form-row">
            <label for="u_perempuan">Jumlah Perempuan</label>
            <input type="number" id="u_perempuan" class="form-control" value="0" min="0" required>
          </div>
          <div class="form-row">
            <label for="u_mat_laki">Meninggal Laki-laki</label>
            <input type="number" id="u_mat_laki" class="form-control" value="0" min="0">
          </div>
          <div class="form-row">
            <label for="u_mat_perempuan">Meninggal Perempuan</label>
            <input type="number" id="u_mat_perempuan" class="form-control" value="0" min="0">
          </div>

          <div class="form-actions">
            <a href="map.html" class="btn btn-outline">Batal</a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Perbarui Data
            </button>
          </div>

          <p class="form-note">
            Data yang Anda perbarui akan menggantikan data sebelumnya. Pastikan informasi akurat.
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
if (!Auth.requireAdmin()) throw new Error('Bukan admin');

document.getElementById('update-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('update-alert');
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  alertBox.innerHTML = '<div class="alert alert-info">Menyimpan data...</div>';

  const kecamatan = document.getElementById('u_kecamatan').value;
  const penyakit  = document.getElementById('u_penyakit').value;
  const tahun     = parseInt(document.getElementById('u_tahun').value);

  const payload = {
    kecamatan, penyakit, tahun,
    laki_laki: parseInt(document.getElementById('u_laki').value) || 0,
    perempuan: parseInt(document.getElementById('u_perempuan').value) || 0,
    meninggal_laki_laki: parseInt(document.getElementById('u_mat_laki').value) || 0,
    meninggal_perempuan: parseInt(document.getElementById('u_mat_perempuan').value) || 0,
    updated_at: new Date().toISOString()
  };

  try {
    const { error } = await supabaseClient
      .from('cases')
      .upsert(payload, {onConflict: 'kecamatan,penyakit,tahun'});
    if (error) throw error;

    alertBox.innerHTML =
      '<div class="alert alert-success"><i class="fas fa-check-circle"></i> ' +
      'Data berhasil diperbarui!</div>';
    setTimeout(() => window.location.href = 'map.html', 1400);
  } catch (err) {
    console.error(err);
    alertBox.innerHTML =
      '<div class="alert alert-error">Gagal menyimpan: ' + err.message + '</div>';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
