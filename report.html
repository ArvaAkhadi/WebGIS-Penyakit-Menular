<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir Lapor Kasus - WebGIS Semarang</title>
  <link rel="icon" href="assests/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="form-page">
  <div class="form-topbar">
    <a href="map.html"><i class="fas fa-arrow-left"></i> Kembali ke Peta</a>
    <span>Lapor Kasus Penyakit Menular - Kota Semarang</span>
  </div>

  <div class="form-container">
    <div class="form-box">
      <div class="form-box-header">Formulir Pelaporan Kasus Baru</div>
      <div class="form-box-body">
        <div id="report-alert"></div>

        <form id="report-form">

          <div class="form-subsection-title">Informasi Informan</div>

          <div class="form-row">
            <label for="informan_nama">Nama Lengkap Informan</label>
            <input type="text" id="informan_nama" class="form-control"
                   placeholder="Nama lengkap informan" required>
          </div>
          <div class="form-row">
            <label for="informan_kontak">Nomor Kontak Informan</label>
            <input type="tel" id="informan_kontak" class="form-control"
                   placeholder="Nomor kontak informan">
          </div>
          <div class="form-row">
            <label for="informan_alamat">Alamat Informan</label>
            <textarea id="informan_alamat" class="form-control"
                      placeholder="Alamat informan" rows="2"></textarea>
          </div>

          <div class="form-subsection-title">Informasi Penderita</div>

          <div class="form-row">
            <label for="penderita_nama">Nama Lengkap Penderita</label>
            <input type="text" id="penderita_nama" class="form-control"
                   placeholder="Nama lengkap penderita" required>
          </div>
          <div class="form-row">
            <label for="penderita_kontak">Nomor Kontak Penderita / Keluarga</label>
            <input type="tel" id="penderita_kontak" class="form-control"
                   placeholder="Nomor kontak penderita/keluarga">
          </div>
          <div class="form-row">
            <label for="jenis_kelamin">Jenis Kelamin</label>
            <select id="jenis_kelamin" class="form-control" required>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div class="form-row">
            <label for="penyakit">Jenis Penyakit</label>
            <select id="penyakit" class="form-control" required>
              <option value="dbd" selected>DBD (Demam Berdarah)</option>
              <option value="leptospirosis">Leptospirosis</option>
              <option value="tb_baru">TB Baru</option>
            </select>
          </div>
          <div class="form-row">
            <label for="kecamatan">Domisili (Kecamatan)</label>
            <select id="kecamatan" class="form-control" required>
              <option value="">— Pilih Kecamatan —</option>
              <option>Semarang Tengah</option>
              <option>Semarang Barat</option>
              <option>Semarang Timur</option>
              <option>Semarang Utara</option>
              <option>Semarang Selatan</option>
              <option>Gajahmungkur</option>
              <option>Candisari</option>
              <option>Gayamsari</option>
              <option>Genuk</option>
              <option>Pedurungan</option>
              <option>Tembalang</option>
              <option>Banyumanik</option>
              <option>Gunungpati</option>
              <option>Mijen</option>
              <option>Ngaliyan</option>
              <option>Tugu</option>
            </select>
          </div>
          <div class="form-row">
            <label>Kondisi Penderita</label>
            <div class="radio-group">
              <label><input type="radio" name="kondisi" value="Meninggal"> Meninggal</label>
              <label><input type="radio" name="kondisi" value="Rawat Inap" checked> Rawat Inap</label>
              <label><input type="radio" name="kondisi" value="Rawat Jalan"> Rawat Jalan</label>
            </div>
          </div>

          <div class="form-actions">
            <a href="map.html" class="btn btn-outline">Batal</a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-paper-plane"></i> Kirim Laporan
            </button>
          </div>

          <p class="form-note">
            Data yang Anda laporkan akan diverifikasi oleh admin terlebih dahulu.
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
document.getElementById('report-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('report-alert');
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  alertBox.innerHTML = '<div class="alert alert-info">Mengirim laporan...</div>';

  try {
    const payload = {
      informan_nama: document.getElementById('informan_nama').value.trim(),
      informan_kontak: document.getElementById('informan_kontak').value.trim(),
      informan_alamat: document.getElementById('informan_alamat').value.trim(),
      penderita_nama: document.getElementById('penderita_nama').value.trim(),
      penderita_kontak: document.getElementById('penderita_kontak').value.trim(),
      jenis_kelamin: document.getElementById('jenis_kelamin').value,
      penyakit: document.getElementById('penyakit').value,
      kecamatan: document.getElementById('kecamatan').value,
      kondisi: document.querySelector('input[name="kondisi"]:checked').value,
      status: 'Menunggu Verifikasi'
    };

    const { error } = await supabaseClient.from('reports').insert([payload]);
    if (error) throw error;

    alertBox.innerHTML =
      '<div class="alert alert-success"><i class="fas fa-check-circle"></i> ' +
      'Laporan berhasil dikirim! Menunggu verifikasi admin.</div>';

    setTimeout(() => window.location.href = 'map.html', 1800);

  } catch (err) {
    console.error(err);
    alertBox.innerHTML =
      '<div class="alert alert-error">Gagal mengirim: ' + err.message + '</div>';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
