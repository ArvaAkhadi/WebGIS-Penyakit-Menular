<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin - WebGIS Semarang</title>
  <link rel="icon" href="assests/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #e8f0fa 0%, #f5faff 100%);
      padding: 20px;
    }
    .login-logo { width: 80px; height: 80px; margin-bottom: 10px; }
    .login-title {
      font-size: 15px; font-weight: 700;
      color: var(--text-dark); text-align: center;
      margin-bottom: 22px; max-width: 380px; line-height: 1.4;
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: #fff; border-radius: 12px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .login-card-header {
      background: #c9e4fa; padding: 14px;
      text-align: center; font-weight: 700;
      font-size: 15px; color: #1e40af;
    }
    .login-card-body { padding: 24px; }
    .login-card-footer {
      padding: 12px; text-align: center;
      font-size: 11px; color: var(--text-mid);
      background: #f8f9fa;
    }
    .checkbox-row {
      display: flex; align-items: center;
      justify-content: space-between;
      font-size: 12px; margin-bottom: 14px;
    }
    .checkbox-row label {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; color: var(--text-mid);
    }
    .forgot-link { color: var(--primary); font-size: 11px; }
    .back-link {
      display: block; text-align: center;
      margin-top: 14px; font-size: 12px;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <img src="assests/logo.svg" alt="Logo" class="login-logo">
  <div class="login-title">
    Sistem Informasi Dinamika Penyakit Menular - Kota Semarang
  </div>

  <div class="login-card">
    <div class="login-card-header">
      <i class="fas fa-user-lock"></i> Login Admin
    </div>
    <div class="login-card-body">
      <div id="login-alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control"
                 placeholder="Masukkan username Anda" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control"
                 placeholder="Masukkan password Anda" required>
        </div>
        <div class="checkbox-row">
          <label>
            <input type="checkbox" id="show-password"> Tampilkan Password
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-sign-in-alt"></i> Masuk
        </button>
      </form>

      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Kembali ke Landing Page
      </a>
    </div>
    <div class="login-card-footer">
      | Developed by Group 4 GIS Automation 2026
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('show-password').addEventListener('change', function() {
  document.getElementById('password').type = this.checked ? 'text' : 'password';
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const alertBox = document.getElementById('login-alert');
  alertBox.innerHTML = '<div class="alert alert-info">Memverifikasi...</div>';

  try {
    const hash = await sha256(password);
    const { data, error } = await supabaseClient
      .from('admins')
      .select('id, username, nama_lengkap')
      .eq('username', username)
      .eq('password_hash', hash)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      alertBox.innerHTML =
        '<div class="alert alert-error"><i class="fas fa-times-circle"></i> ' +
        'Username atau password salah.</div>';
      return;
    }

    Auth.login({
      id: data.id,
      username: data.username,
      nama: data.nama_lengkap
    });

    alertBox.innerHTML =
      '<div class="alert alert-success"><i class="fas fa-check"></i> ' +
      'Login berhasil. Mengalihkan...</div>';
    setTimeout(() => window.location.href = 'map.html', 800);

  } catch (err) {
    console.error(err);
    alertBox.innerHTML =
      '<div class="alert alert-error">Terjadi kesalahan: ' + err.message + '</div>';
  }
});
</script>
</body>
</html>
